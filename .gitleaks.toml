# gitleaks config for the secret scan in .github/workflows/lint.yml (job "gitleaks").
#
# Extends the default rules unchanged and adds two of our own. Phase 0 gate gap #13: the
# planted AWS key AKIAIOSFODNN7EXAMPLE was not caught because the default aws-access-token
# rule allowlists any match ending in EXAMPLE (it is AWS's own documentation key). The
# scan was fine; the test value was excused. The first rule below gives the gate a fake
# secret no allowlist excuses: plant MERCS_TEST_SECRET_ plus 16 letters or digits in a
# throwaway PR and the gitleaks job must go red.
title = "MERCS gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "mercs-test-secret"
description = "MERCS fake secret planted to prove the secret scan fires"
regex = '''MERCS_TEST_SECRET_[A-Za-z0-9]{16}'''
keywords = ["mercs_test_secret_"]

# Catch-all for sk- style API keys (OpenAI, Anthropic, Stripe and similar) whose exact
# vendor prefix the default rules do not know. Entropy keeps "sk-your-key-goes-here"
# style placeholders out.
[[rules]]
id = "mercs-generic-sk-key"
description = "High-entropy sk- style API key"
regex = '''\bsk-[A-Za-z0-9_-]{24,}'''
entropy = 4.0
keywords = ["sk-"]

# Art provenance manifests list each file with its SHA-256. A file named *_token_* (a map token
# sprite) puts the word "token" beside a 64-hex value, which the default generic-api-key rule reads
# as a key. Excused only on a line that is exactly a quoted asset file name (.png/.json/.gpl/.glb)
# and a lowercase SHA-256 (the provenance.json "files" shape): any other line in any file, including
# a key in a provenance.json, still fails. No path rule: in gitleaks 8.24.3 (pinned by CI) a path in
# the global [allowlist] excuses the whole file whatever "condition" says (tested locally), and
# 8.24.3 ignores the newer [[allowlists]] / targetRules syntax.
[allowlist]
description = "SHA-256 file hashes in art provenance manifests"
regexTarget = "line"
regexes = ['''^\s*"[A-Za-z0-9_.-]+\.(png|json|gpl|glb)": "[0-9a-f]{64}",?\s*$''']
