name: lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-caps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce line caps
        shell: bash
        run: |
          # Caps are read from each doc's own "Cap: N lines" header (first 6 lines),
          # so the number lives in the doc, not here. Handoffs are capped by the template.
          fail=0
          check() { # file cap
            n=$(wc -l < "$1")
            if [ "$n" -gt "$2" ]; then
              echo "::error file=$1::$n lines, cap is $2"
              fail=1
            fi
          }
          for f in docs/*.md; do
            cap=$(head -n 6 "$f" | sed -n 's/^Cap: \([0-9][0-9]*\) lines.*/\1/p' | head -n 1)
            [ -n "$cap" ] && check "$f" "$cap"
          done
          for f in agent-handoffs/*.md; do
            [ -e "$f" ] && check "$f" 120
          done
          exit $fail

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
